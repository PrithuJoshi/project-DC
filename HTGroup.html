<!DOCTYPE html>
<html>
<head>
    <title>HTG</title>
  <title> Calculator Divide</title>
  <style>
    input, output {
      font-size: 20px;
      padding: 10px;
      margin: 20px;
    }
  </style>
</head>
<body>
  <h2> Divide Calculator ( Calculator of perfect Division)</h2>

            <form oninput="result.value = parseInt(a.value) / parseInt(b.value)">

    
    <input type="number" name="a" value="Type a number"> /
    <input type="number" name="b" value="Answer"> =
    
    <output name="result">0</output>
    
  </form>
</body>
</html>
